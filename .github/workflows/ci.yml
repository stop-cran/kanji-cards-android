name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (the comment is the tag it was taken from); update them deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # Content-dependent tests read ../../learning-japanese relative to app/; without it they skip silently.
      # The clone tracks main on purpose: it is integration coverage that content changes still parse, not a pinned fixture.
      - run: git clone --depth 1 https://github.com/stop-cran/learning-japanese.git ../learning-japanese
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew detekt testDebugUnitTest assembleDebug lintDebug assembleRelease
