# Detekt on top of the defaults. Existing findings live in detekt-baseline.xml; new code must not add findings.
# Regenerate the baseline only deliberately: ./gradlew detektBaseline
build:
  maxIssues: 0

style:
  MagicNumber:
    active: false          # UI and geometry code is full of dp/px constants; tracked in #21
  MaxLineLength:
    maxLineLength: 160
  WildcardImport:
    active: false
  ReturnCount:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: false